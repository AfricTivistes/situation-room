version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: situation-room-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-situation_room}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d
    restart: unless-stopped

  nocodb:
    image: nocodb/nocodb:latest
    container_name: situation-room-nocodb
    environment:
      NC_DB: "pg://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-situation_room}"
      NC_AUTH_JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
