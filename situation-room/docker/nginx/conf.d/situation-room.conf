# =============================================================
# Nginx – Configuration du Virtual Host
# Situation Room / Africa ElectionLab
# =============================================================
# Remplacer "votre-domaine.org" par votre vrai domaine
# =============================================================

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name votre-domaine.org www.votre-domaine.org;

    # Validation des certificats Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur principal HTTPS
server {
    listen 443 ssl;
    server_name votre-domaine.org www.votre-domaine.org;

    # Certificats SSL (générés par Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/votre-domaine.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.org/privkey.pem;

    # Paramètres SSL recommandés (sécurité renforcée)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Site public Astro ──────────────────────────────────────
    # Accessible depuis la racine du domaine
    location / {
        proxy_pass http://public:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Dashboard Refine.js (espace privé) ────────────────────
    # Accessible sur /dashboard – À protéger par authentification !
    location /dashboard {
        proxy_pass http://dashboard:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API NocoDB ─────────────────────────────────────────────
    # Proxy vers NocoDB pour les appels API depuis le dashboard
    location /nocodb/ {
        proxy_pass http://nocodb:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket pour les mises à jour temps réel de NocoDB
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Webhooks Node.js ──────────────────────────────────────
    # Accessible depuis les API externes (Telegram, Africa's Talking...)
    location /webhooks/ {
        proxy_pass http://webhooks:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Limite de taille pour les payloads webhook (protège contre les abus)
        client_max_body_size 1M;
    }

    # Logs d'erreur spécifiques à ce site
    error_log /var/log/nginx/situation-room.error.log;
    access_log /var/log/nginx/situation-room.access.log;
}
